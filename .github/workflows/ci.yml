name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          # A throwaway superuser for a database that lives only as long as this job.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Create the database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-only
          POSTGRES_USER: postgres
        run: |
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          SYNQSONG_OWNER_PASSWORD=$owner SYNQSONG_APP_PASSWORD=$app sh postgres/init/01-roles.sh
          {
            echo "TEST_MIGRATION_DATABASE_URL=postgres://synqsong_owner:$owner@localhost:5432/synqsong_test?sslmode=disable"
            echo "TEST_DATABASE_URL=postgres://synqsong_app:$app@localhost:5432/synqsong_test?sslmode=disable"
          } >> "$GITHUB_ENV"

      - name: Test
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./...
