services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SYNQSONG_OWNER_PASSWORD: ${SYNQSONG_OWNER_PASSWORD:?set SYNQSONG_OWNER_PASSWORD in .env}
      SYNQSONG_APP_PASSWORD: ${SYNQSONG_APP_PASSWORD:?set SYNQSONG_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${PG_DATA_DIR:-./.data/postgres}:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synqsong"]
      interval: 2s
      timeout: 3s
      retries: 30
